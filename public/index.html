<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>MATRYX CHAT</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg-effects">
  <span></span><span></span><span></span>
</div>

<!-- =========================
     AUTH
========================= -->

<div id="auth" class="screen">
  <div class="auth-glow"></div>

  <div class="card auth-card">

    <div class="brand-mark">
      <img
        src="/matryx-m-logo.png"
        class="main-logo-img"
        alt="MATRYX"
      >
      <div class="logo-ring"></div>
    </div>

    <div class="premium-label">
      <span></span>
      PRIVATE MESSAGING
      <span></span>
    </div>

    <h1>MATRYX <strong>CHAT</strong></h1>
    <p class="auth-subtitle">Fast. Private. Real-time.</p>

    <div class="input-wrap">
      <span class="input-icon">📱</span>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        placeholder="Phone number"
        maxlength="15"
      >
    </div>

    <div class="input-wrap">
      <span class="input-icon">🔐</span>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        maxlength="100"
      >

      <button
        type="button"
        class="password-toggle"
        onclick="togglePassword()"
        aria-label="Show password"
      >👁</button>
    </div>

    <div class="row">

      <button
        class="primary-btn"
        onclick="auth('login')"
      >
        <span>LOGIN</span>
        <i></i>
      </button>

      <button
        class="ghost"
        onclick="auth('register')"
      >
        REGISTER
      </button>

    </div>

    <small id="authMsg"></small>

    <div class="auth-footer">
      <span class="secure-dot"></span>
      MATRYX PRIVATE NETWORK
    </div>

  </div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside>

    <div class="sidebar-top">

      <div class="brand">

        <div class="mini-logo">
          <img
            src="/matryx-m-logo.png"
            alt="M"
          >
        </div>

        <div>
          <b>MATRYX</b>
          <small>CHAT</small>
        </div>

      </div>

      <div class="brand-status">
        <span></span>
        LIVE
      </div>

    </div>


    <!-- PROFILE -->

    <div class="profile-card">

      <div class="avatar-wrap">

        <div
          class="avatar"
          id="myAvatar"
        >
          M
        </div>

        <img
          id="myAvatarImage"
          class="avatar-image hidden"
          alt="Profile"
        >

      </div>

      <div class="profile-info">

        <b id="me">@user</b>

        <small>
          <span></span>
          Active now
        </small>

      </div>

      <button
        id="editProfileBtn"
        type="button"
        title="Edit Profile"
        onclick="openProfileEditor()"
      >
        ✎
      </button>

      <button
        id="logoutBtn"
        type="button"
        onclick="logout()"
        title="Logout"
      >
        ⎋
      </button>

    </div>


    <!-- SEARCH -->

    <div class="search-wrap">

      <span>⌕</span>

      <input
        id="search"
        placeholder="Search users..."
        oninput="renderUsers()"
      >

    </div>


    <!-- CONTACTS -->

    <div class="section-title">

      <span>CONTACTS</span>

      <small id="contactCount"></small>

    </div>

    <div id="users"></div>


    <div class="sidebar-footer">

      <span class="pulse"></span>

      MATRYX CHAT • SECURE

    </div>

  </aside>


  <!-- =========================
       MAIN CHAT
  ========================= -->

  <main>

    <header>

      <div class="chat-user">

        <div
          class="chat-avatar"
          id="chatAvatar"
        >
          M
        </div>

        <img
          id="chatAvatarImage"
          class="chat-avatar-image hidden"
          alt="User"
        >

        <div>

          <b id="chatName">
            Select a user
          </b>

          <span id="status"></span>

          <span id="typing"></span>

        </div>

      </div>


      <!-- CALL BUTTONS -->

      <div class="call-buttons">

        <button
          onclick="startCall(false)"
          title="Voice call"
          type="button"
        >
          <span>☎</span>
        </button>

        <button
          onclick="startCall(true)"
          title="Video call"
          type="button"
        >
          <span>▣</span>
        </button>

      </div>

    </header>


    <!-- MESSAGES -->

    <section id="messages">

      <div class="empty-chat">

        <h2>MATRYX CHAT</h2>

        <p>
          Select a contact to start a private conversation
        </p>

      </div>

    </section>

    <div id="typing"></div>


    <!-- COMPOSER -->

    <form id="composer">

      <label
        class="attach"
        title="Attach file"
      >

        <span>＋</span>

        <input
          id="file"
          type="file"
          accept="image/*,video/*,.pdf,.txt,.zip"
          hidden
        >

      </label>


      <div class="message-input">

        <input
          id="text"
          autocomplete="off"
          placeholder="Write a message..."
        >

      </div>


      <button
        class="send-btn"
        type="submit"
      >

        <span>SEND</span>
        <b>➤</b>

      </button>

    </form>

  </main>

</div>


<!-- =========================
     PROFILE EDITOR
========================= -->

<div
  id="profileModal"
  class="profile-modal hidden"
>

  <div
    class="profile-overlay"
    onclick="closeProfileEditor()"
  ></div>

  <div class="profile-editor">

    <div class="profile-editor-header">

      <div>

        <small>MATRYX ACCOUNT</small>

        <h2>Edit Profile</h2>

      </div>

      <button
        type="button"
        onclick="closeProfileEditor()"
        aria-label="Close"
      >
        ✕
      </button>

    </div>


    <div class="profile-preview">

      <div class="profile-photo-wrap">

        <div
          id="profilePreviewLetter"
          class="profile-preview-letter"
        >
          M
        </div>

        <img
          id="profilePreviewImage"
          class="profile-preview-image hidden"
          alt="Profile preview"
        >

      </div>

      <label class="photo-btn">

        <span>＋</span>
        Change Photo

        <input
          id="profilePhoto"
          type="file"
          accept="image/*"
          hidden
        >

      </label>

    </div>


    <div class="profile-field">

      <label for="profileUsername">
        YOUR NAME
      </label>

      <input
        id="profileUsername"
        type="text"
        maxlength="30"
        autocomplete="nickname"
        placeholder="Enter your name"
      >

    </div>


    <small
      id="profileMsg"
      class="profile-msg"
    ></small>


    <div class="profile-actions">

      <button
        type="button"
        class="profile-cancel"
        onclick="closeProfileEditor()"
      >
        CANCEL
      </button>

      <button
        type="button"
        class="profile-save"
        onclick="saveProfile()"
      >
        <span>SAVE PROFILE</span>
        <i></i>
      </button>

    </div>

  </div>

</div>


<!-- =========================
     CALL SCREEN
========================= -->

<div
  id="call"
  class="call hidden"
>

  <div class="callbar">

    <div>

      <small>MATRYX CALL</small>

      <b id="callTitle">
        Call
      </b>

    </div>

    <button
      type="button"
      onclick="endCall()"
    >
      ✕
    </button>

  </div>


  <div class="videos">

    <div class="remote-wrap">

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <div class="remote-placeholder">

        <div class="call-avatar">
          M
        </div>

        <span>
          Connecting...
        </span>

      </div>

    </div>


    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

  </div>


  <div class="call-actions">

    <button
      type="button"
      onclick="toggleMute()"
      title="Mute"
    >
      🎙
    </button>

    <button
      type="button"
      class="end-call"
      onclick="endCall()"
    >
      ● END CALL
    </button>

  </div>

</div>


<!-- SOCKET.IO -->

<script src="/socket.io/socket.io.js"></script>

<!-- APP -->

<script src="app.js"></script>


<script>

/* =========================
   PASSWORD VISIBILITY
========================= */

function togglePassword(){

  const input =
    document.getElementById("password");

  if(!input) return;

  if(input.type === "password"){

    input.type = "text";

  }else{

    input.type = "password";

  }

}


/* =========================
   MY AVATAR
========================= */

function updateMyAvatar(){

  try{

    const meData =
      JSON.parse(
        localStorage.getItem("matryx_me") || "null"
      );

    const avatar =
      document.getElementById("myAvatar");

    const avatarImage =
      document.getElementById("myAvatarImage");

    if(
      !meData ||
      !meData.username
    ){

      if(avatar){
        avatar.textContent = "M";
      }

      if(avatarImage){
        avatarImage.classList.add("hidden");
      }

      return;

    }

    const letter =
      meData.username
        .charAt(0)
        .toUpperCase();

    if(avatar){

      avatar.textContent =
        letter;

    }

    if(
      avatarImage &&
      meData.avatar
    ){

      avatarImage.src =
        meData.avatar;

      avatarImage.classList.remove(
        "hidden"
      );

      if(avatar){
        avatar.classList.add("hidden");
      }

    }else{

      if(avatarImage){
        avatarImage.classList.add(
          "hidden"
        );
      }

      if(avatar){
        avatar.classList.remove(
          "hidden"
        );
      }

    }

    const me =
      document.getElementById("me");

    if(me){

      me.textContent =
        "@" + meData.username;

    }

  }catch(error){

    console.error(
      "MY AVATAR ERROR:",
      error
    );

  }

}


/* =========================
   CHAT AVATAR
========================= */

function updateChatAvatar(){

  const name =
    document.getElementById("chatName");

  const avatar =
    document.getElementById("chatAvatar");

  const avatarImage =
    document.getElementById(
      "chatAvatarImage"
    );

  if(
    !name ||
    !avatar
  ) return;


  if(
    !name.textContent ||
    name.textContent === "Select a user"
  ){

    avatar.textContent = "M";

    if(avatarImage){
      avatarImage.classList.add(
        "hidden"
      );
    }

    avatar.classList.remove(
      "hidden"
    );

    return;

  }


  avatar.textContent =
    name.textContent
      .charAt(0)
      .toUpperCase();

}


/* =========================
   PROFILE EDITOR
========================= */

function openProfileEditor(){

  const modal =
    document.getElementById(
      "profileModal"
    );

  const input =
    document.getElementById(
      "profileUsername"
    );

  const previewLetter =
    document.getElementById(
      "profilePreviewLetter"
    );

  const previewImage =
    document.getElementById(
      "profilePreviewImage"
    );

  const meData =
    JSON.parse(
      localStorage.getItem(
        "matryx_me"
      ) || "null"
    );

  if(!meData){

    return;

  }


  if(input){

    input.value =
      meData.username || "";

  }


  if(previewLetter){

    previewLetter.textContent =
      (
        meData.username ||
        "M"
      )
      .charAt(0)
      .toUpperCase();

  }


  if(
    previewImage &&
    meData.avatar
  ){

    previewImage.src =
      meData.avatar;

    previewImage.classList.remove(
      "hidden"
    );

    if(previewLetter){

      previewLetter.classList.add(
        "hidden"
      );

    }

  }else{

    if(previewImage){

      previewImage.classList.add(
        "hidden"
      );

    }

    if(previewLetter){

      previewLetter.classList.remove(
        "hidden"
      );

    }

  }


  const msg =
    document.getElementById(
      "profileMsg"
    );

  if(msg){

    msg.textContent = "";

  }


  if(modal){

    modal.classList.remove(
      "hidden"
    );

  }


  setTimeout(()=>{

    if(input){

      input.focus();

      input.select();

    }

  },100);

}


/* =========================
   CLOSE PROFILE
========================= */

function closeProfileEditor(){

  const modal =
    document.getElementById(
      "profileModal"
    );

  if(modal){

    modal.classList.add(
      "hidden"
    );

  }

}


/* =========================
   PROFILE PHOTO PREVIEW
========================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    const photo =
      document.getElementById(
        "profilePhoto"
      );

    if(photo){

      photo.addEventListener(
        "change",
        ()=>{

          const file =
            photo.files &&
            photo.files[0];

          if(!file) return;

          if(
            !file.type.startsWith(
              "image/"
            )
          ){

            return;

          }

          const url =
            URL.createObjectURL(
              file
            );

          const image =
            document.getElementById(
              "profilePreviewImage"
            );

          const letter =
            document.getElementById(
              "profilePreviewLetter"
            );

          if(image){

            image.src = url;

            image.classList.remove(
              "hidden"
            );

          }

          if(letter){

            letter.classList.add(
              "hidden"
            );

          }

        }
      );

    }

  }
);


/* =========================
   PROFILE NAME LIVE PREVIEW
========================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    const input =
      document.getElementById(
        "profileUsername"
      );

    const letter =
      document.getElementById(
        "profilePreviewLetter"
      );

    if(
      input &&
      letter
    ){

      input.addEventListener(
        "input",
        ()=>{

          const value =
            input.value.trim();

          letter.textContent =
            value
              ? value.charAt(0).toUpperCase()
              : "M";

        }
      );

    }

  }
);


/* =========================
   ENTER KEY LOGIN
========================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    const phone =
      document.getElementById(
        "phone"
      );

    const password =
      document.getElementById(
        "password"
      );


    function enterLogin(e){

      if(e.key !== "Enter") return;

      e.preventDefault();

      if(
        phone &&
        password &&
        phone.value.trim() &&
        password.value
      ){

        if(
          typeof auth === "function"
        ){

          auth("login");

        }

      }

    }


    if(phone){

      phone.addEventListener(
        "keydown",
        enterLogin
      );

    }


    if(password){

      password.addEventListener(
        "keydown",
        enterLogin
      );

    }


    updateMyAvatar();

  }
);


/* =========================
   UPDATE AFTER USER SELECT
========================= */

const originalSelectUser =
  window.selectUser;

if(originalSelectUser){

  window.selectUser =
    async function(u){

      await originalSelectUser(u);

      updateChatAvatar();

    };

}


/* =========================
   UPDATE PROFILE FROM
   SOCKET EVENT
========================= */

if(
  typeof io !== "undefined"
){

  try{

    const profileSocket =
      typeof socket !== "undefined"
        ? socket
        : null;

    if(profileSocket){

      profileSocket.on(
        "profile:update",
        user => {

          try{

            const meData =
              JSON.parse(
                localStorage.getItem(
                  "matryx_me"
                ) || "null"
              );

            if(
              meData &&
              user &&
              meData.id === user.id
            ){

              localStorage.setItem(
                "matryx_me",
                JSON.stringify(user)
              );

              updateMyAvatar();

            }

          }catch{}

        }
      );

    }

  }catch{}

}


/* =========================
   ESC CLOSE PROFILE
========================= */

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Escape"
    ){

      const modal =
        document.getElementById(
          "profileModal"
        );

      if(
        modal &&
        !modal.classList.contains(
          "hidden"
        )
      ){

        closeProfileEditor();

      }

    }

  }
);

</script>

</body>
</html>

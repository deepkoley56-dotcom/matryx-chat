<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>MATRYX CHAT</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg-effects">
  <span></span><span></span><span></span>
</div>

<!-- AUTH -->
<div id="auth" class="screen">
  <div class="auth-glow"></div>

  <div class="card auth-card">

    <div class="brand-mark">
      <div class="logo">M</div>
      <div class="logo-ring"></div>
    </div>

    <div class="premium-label">
      <span></span> PRIVATE MESSAGING <span></span>
    </div>

    <h1>MATRYX <strong>CHAT</strong></h1>
    <p class="auth-subtitle">Fast. Private. Real-time.</p>

    <div class="input-wrap">
      <span class="input-icon">◉</span>
      <input id="username" placeholder="Enter username" maxlength="30" autocomplete="off">
    </div>

    <div class="row">
      <button class="primary-btn" onclick="auth('login')">
        <span>LOGIN</span>
        <i></i>
      </button>

      <button class="ghost" onclick="auth('register')">
        REGISTER
      </button>
    </div>

    <small id="authMsg"></small>

    <div class="auth-footer">
      <span class="secure-dot"></span>
      MATRYX PRIVATE NETWORK
    </div>

  </div>
</div>


<!-- APP -->
<div id="app" class="hidden">

  <!-- SIDEBAR -->
  <aside>

    <div class="sidebar-top">

      <div class="brand">
        <div class="mini-logo">M</div>
        <div>
          <b>MATRYX</b>
          <small>CHAT</small>
        </div>
      </div>

      <div class="brand-status">
        <span></span> LIVE
      </div>

    </div>

    <div class="profile-card">
      <div class="avatar" id="myAvatar">M</div>
      <div class="profile-info">
        <b id="me">@user</b>
        <small><span></span> Active now</small>
      </div>

      <button id="logoutBtn" type="button" onclick="logout()" title="Logout">
        ⎋
      </button>
    </div>

    <div class="search-wrap">
      <span>⌕</span>
      <input id="search" placeholder="Search users..." oninput="renderUsers()">
    </div>

    <div class="section-title">
      <span>CONTACTS</span>
      <small id="contactCount"></small>
    </div>

    <div id="users"></div>

    <div class="sidebar-footer">
      <span class="pulse"></span>
      MATRYX CHAT • SECURE
    </div>

  </aside>


  <!-- CHAT -->
  <main>

    <header>

      <div class="chat-user">

        <div class="chat-avatar" id="chatAvatar">
          M
        </div>

        <div>
          <b id="chatName">Select a user</b>
          <span id="status"></span>
          <span id="typing"></span>
        </div>

      </div>

      <div class="call-buttons">

        <button onclick="startCall(false)" title="Voice call">
          <span>☎</span>
        </button>

        <button onclick="startCall(true)" title="Video call">
          <span>▣</span>
        </button>

      </div>

    </header>


    <section id="messages">

      <div class="empty-chat">
        <div class="empty-logo">M</div>
        <h2>MATRYX CHAT</h2>
        <p>Select a contact to start a private conversation.</p>
      </div>

    </section>


    <div id="typing"></div>


    <form id="composer">

      <label class="attach" title="Attach file">
        <span>＋</span>
        <input id="file" type="file"
          accept="image/*,video/*,.pdf,.txt,.zip" hidden>
      </label>

      <div class="message-input">
        <input
          id="text"
          autocomplete="off"
          placeholder="Write a message..."
        >
      </div>

      <button class="send-btn" type="submit">
        <span>SEND</span>
        <b>➤</b>
      </button>

    </form>

  </main>

</div>


<!-- CALL SCREEN -->
<div id="call" class="call hidden">

  <div class="callbar">

    <div>
      <small>MATRYX CALL</small>
      <b id="callTitle">Call</b>
    </div>

    <button onclick="endCall()">✕</button>

  </div>

  <div class="videos">

    <div class="remote-wrap">
      <video id="remoteVideo" autoplay playsinline></video>

      <div class="remote-placeholder">
        <div class="call-avatar">M</div>
        <span>Connecting...</span>
      </div>
    </div>

    <video id="localVideo" autoplay muted playsinline></video>

  </div>

  <div class="call-actions">

    <button onclick="toggleMute()" title="Mute">
      🎙
    </button>

    <button class="end-call" onclick="endCall()">
      ● END CALL
    </button>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

<script>
function updateMyAvatar(){
  const meData = JSON.parse(localStorage.getItem("matryx_me") || "null");
  if(meData && meData.username){
    const letter = meData.username.charAt(0).toUpperCase();
    const a = document.getElementById("myAvatar");
    if(a) a.textContent = letter;
  }
}

function updateChatAvatar(){
  const name = document.getElementById("chatName");
  const avatar = document.getElementById("chatAvatar");

  if(name && avatar && name.textContent && name.textContent !== "Select a user"){
    avatar.textContent = name.textContent.charAt(0).toUpperCase();
  }
}

const oldSelectUser = window.selectUser;
if(oldSelectUser){
  window.selectUser = async function(u){
    await oldSelectUser(u);
    updateChatAvatar();
  };
}

updateMyAvatar();
</script>

</body>
</html>
